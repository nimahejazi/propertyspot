version: "3"

services:
  propertyspot_db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: REDACTED
      MYSQL_DATABASE: propertyspot
      MYSQL_USER: propertyspot
      MYSQL_PASSWORD: REDACTED
    container_name: propertyspot_db_test

  propertyspot:
    depends_on:
      - propertyspot_db
    build: .
    ports:
      - 80
      - 443
    expose:
      - 80
    restart: always
    container_name: propertyspot_laravel_test
    volumes:
      - ${WORKSPACE}/laravel:/var/www/html
      - ${WORKSPACE}/php-custom.ini:/usr/local/etc/php/conf.d/php-custom.ini

volumes:
  db_data:

networks:
  default:
    external:
      name: nginx-proxy
