version: "3"

services:
  propertyspot_db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: VAL;k4(f$6B@M*Z*deHvgruEtR
      MYSQL_DATABASE: propertyspot
      MYSQL_USER: propertyspot
      MYSQL_PASSWORD: ze7:gW+(*9_.Yh,6I]9W.b,2!H
    container_name: propertyspot_db

  propertyspot:
    depends_on:
      - propertyspot_db
    build: .
    ports:
      - 80
      - 443
    restart: always
    container_name: propertyspot_laravel
    environment: 
      VIRTUAL_HOST: propertyspot.net, www.propertyspot.net
      LETSENCRYPT_HOST: propertyspot.net, www.propertyspot.net
      LETSENCRYPT_EMAIL: nhejazi@gmail.com
    volumes:
      - ./laravel:/var/www/html
      - ./site.conf:/etc/nginx/conf.d/site.conf
      - ./php-custom.ini:/usr/local/etc/php/conf.d/php-custom.ini

volumes:
  db_data:

networks:
  default:
    external:
      name: nginx-proxy
